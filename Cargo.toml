[workspace]
resolver = "3"
members = [
  "demo/cdylib",
  "demo/routines",
  "demo/tokio",
  "demo/wasm",
  "demo/boundary",
  "sans_effort",
  "sans_effort_host",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inkandswitch/sans_effort"
authors = ["Brooklyn Zelenka <hello@brooklynzelenka.com>"]

[workspace.dependencies]
# Internal crates
sans_effort = { version = "0.1.0", path = "sans_effort", default-features = false }
sans_effort_host = { version = "0.1.0", path = "sans_effort_host" }

# External crates
bolero = "0.13"
portable-atomic = { version = "1", default-features = false, features = [
  "fallback",
] }
portable-atomic-util = { version = "0.2", default-features = false, features = [
  "alloc",
] }
spin = { version = "0.12", default-features = false, features = [
  "mutex",
  "spin_mutex",
] }
thiserror = { version = "2.0", default-features = false }
trybuild = "1"
tokio = { version = "1", default-features = false, features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
# `=`: the crate and `wasm-bindgen-cli` must match exactly, and the CLI comes
# from nixpkgs-unstable (`unstable.wasm-bindgen-cli` in flake.nix). Bump both together.
wasm-bindgen = "=0.2.127"
# Released in lockstep with wasm-bindgen; each pins it exactly.
js-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }

rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_extern_crates = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
indexing_slicing = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
panic = "warn"
todo = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"            # various transitive deps
pedantic = { level = "deny", priority = -1 }

# A library workspace, not an embedded one: optimise for speed, keep
# unwinding (the host crate's panic isolation depends on it), keep symbols.
# Fat LTO: the per-step cost lives in cross-crate inlining (routine → context
# → driver), and a release build is a one-off.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

# Close to release, but thin LTO: benches are rebuilt often.

[profile.bench]
codegen-units = 1
debug = true
lto = "thin"
opt-level = 3
