# cargo-mutants: `nix develop -c test:mutants`, or `test:mutants:diff` for the
# lines a change touches. A mutant listed here is one no test should catch;
# each has its reason.
exclude_re = [
  # What a `Debug` impl prints is for people reading logs, not behaviour.
  "impl (core::)?(fmt::)?Debug for",
  # `TokioOutput` logs only its first failed write; which write logs shows
  # only in `tracing` output. Later writes are dropped either way (tested).
  "delete ! in <impl WriteLine for TokioOutput<W>>::write_line",
  # The host table's `note` checks whether any session is open only to skip
  # taking the table's lock; `>=` would take it on every call, with the same
  # result.
  "replace > with >= in note",
  # `Decode for ()` is `Ok(())`, which is what `Ok(Default::default())` is.
  "replace <impl Decode for \\(\\)>::decode -> Result<Self, DecodeError> with Ok\\(Default::default\\(\\)\\)",
  # `encoded::encode` sizes its output from the frame count: a capacity hint,
  # so a wrong count changes no output, only how often the buffer grows —
  # which `bench:instructions`' hard limits on heap blocks guard.
  "replace \\+ with [-*] in encode$",
  # The loom lock is built only with `--cfg sans_effort_loom`, which the tests
  # do not set; `test:loom` runs the models that use it.
  "-> loom::sync::MutexGuard",
  # The outbox learns the driver's waker only to skip keeping a waker that
  # would wake the driver, which polls after every reply anyway. Without it
  # every request keeps one, with the same result.
  "replace Outbox<E>::adopt with \\(\\)",
  # `Mail::open` pushes when the new id is the highest (`>`) and otherwise
  # inserts at its sorted place (`<`); the insert is right in either case,
  # so the push test is only a shortcut. Ids are unique, so `<` and `<=`
  # sort alike.
  "replace > with (>=|==) in Mail::open",
  "replace < with <= in Mail::open",
  # `Mail::remove` pops when the slot is the last and otherwise removes it in
  # place, which is right in either case; `at` always names a slot.
  "replace \\+ with \\* in Mail::remove",
  "replace < with <= in Mail::remove",
]

exclude_globs = [
  # Built only with the `portable-atomic` feature, which the tests do not
  # enable; `cargo hack` checks that it compiles.
  "sans-effort-core/src/driver/wake/portable_atomic.rs",
]
