[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "warn"

[licenses]
# The permissive set this tree uses (MIT, Apache-2.0, Unicode-3.0) plus the
# standard ones a new dependency is likely to bring. Anything else is a
# deliberate decision, not a default.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
