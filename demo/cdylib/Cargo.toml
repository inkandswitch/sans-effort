[package]
name = "greeter_cdylib"
version = "0.1.0"
description = "C ABI over the greeter: the binding a foreign host loads. The one crate in the workspace that touches foreign memory"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
sans-effort = { workspace = true, features = ["std"] }
sans-effort-effects = { workspace = true }
sans-effort-host = { workspace = true }
greeter_boundary = { version = "0.1.0", path = "../boundary" }
routines = { version = "0.1.0", path = "../routines" }

# The FFI boundary: reading host bytes and handing buffers back needs
# `unsafe`, so this crate cannot inherit the workspace's `forbid`. Everything
# else is the workspace's lint set, restated.
[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
missing_docs = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_extern_crates = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
