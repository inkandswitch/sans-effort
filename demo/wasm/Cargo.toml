[package]
name = "greeter_wasm"
version = "0.1.0"
description = "The greeter in the browser: a JS-backed context, the event loop as executor, no driver"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
async-channel = { workspace = true }
sans-effort = { workspace = true, features = ["std"] }
sans-effort-effects = { workspace = true, features = ["std"] }
js-sys = { workspace = true }
routines = { version = "0.1.0", path = "../routines" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
