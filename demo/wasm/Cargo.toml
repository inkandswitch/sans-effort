[package]
name = "greeter_wasm"
version = "0.1.0"
description = "The greeter as a wasm-bindgen module: the generated class is the handle, typed getters replace the byte codec"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
effect_routine = { workspace = true, features = ["std"] }
effect_routine_host = { workspace = true }
greeter_wire = { version = "0.1.0", path = "../wire" }
routines = { version = "0.1.0", path = "../routines" }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
