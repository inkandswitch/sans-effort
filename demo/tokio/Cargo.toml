[package]
name = "greeter_tokio"
version = "0.1.0"
description = "The greeter on tokio with no driver: a native context, and tokio polls the routine itself"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sans-effort = { workspace = true, features = ["std"] }
sans-effort-effects = { workspace = true, features = ["std"] }
routines = { version = "0.1.0", path = "../routines" }
sans-effort-tokio = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
