[toolchain]
# For rustup users: the development toolchain, the same as the Nix flake's
# `rustVersion` in `flake.nix`, which the dev shell and CI use (msrv.yml
# checks the two agree). It may run ahead of the MSRV, Cargo.toml's
# `rust-version`, which `test:msrv` checks with a toolchain of its own.
channel = "1.91.0"
components = ["clippy", "rustfmt"]
