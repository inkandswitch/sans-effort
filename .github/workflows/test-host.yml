name: Test on Host

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix
        with:
          cargo-cache: test

      # Default features, all features, and doc tests. The flake's toolchain is
      # the MSRV (msrv.yml checks the pins agree), so this tests at the MSRV.
      - run: nix develop .#ci --command test:host

  # The driver's waker and outbox under every interleaving loom finds.
  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix
        with:
          cargo-cache: loom

      - run: nix develop .#ci --command test:loom
