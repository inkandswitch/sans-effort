name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Clippy (wasm32 target)
        # The host clippy above never sees `#[wasm_bindgen]` code paths that are
        # cfg'd for wasm32, so lint the module against its real target too.
        run: cargo clippy -p greeter_wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
