name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix
        with:
          cargo-cache: quality

      # Formatting, Clippy (all features, and the wasm module on wasm32), and
      # rustdoc with no warnings.
      - run: nix develop .#ci --command lint
