name: Demo

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same routine — native on tokio, native on Node, driven from Python and
  # from Java over the C ABI — must produce the same transcript. Two runtimes
  # that can poll it, two hosts that cannot; ABI.md exercised twice over.
  hosts-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix
        with:
          cargo-cache: demo

      # Every mode, on every host; transcripts must agree. A deadline's host
      # that fails to cancel its abandoned timer overruns the time limit.
      - name: Transcripts agree
        run: nix develop .#ci --command demo

      # Routines that misbehave on purpose (`routines::faults`): a deadlock
      # must be reported, the same way by every host, not hung on.
      - name: "Host check: a deadlock is reported"
        run: nix develop .#ci --command demo:faults

      # Every host under seeded, adversarial schedules must write what tokio
      # writes on an ordinary run; every Python run must replay exactly.
      - name: "Host check: seeded schedules agree"
        run: nix develop .#ci --command demo:stress 3
