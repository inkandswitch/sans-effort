name: MSRV

# Every other workflow builds and tests with the flake's toolchain, so they
# test at the MSRV exactly when the flake's toolchain is the MSRV. This checks
# it is: Cargo.toml's rust-version, rust-toolchain.toml's channel (for rustup
# users), and flake.nix's rustVersion must agree, modulo the patch component.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - "flake.nix"
      - ".github/workflows/msrv.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The toolchain pins are the MSRV
        run: |
          MSRV=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          CHANNEL=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          FLAKE=$(sed -n 's/^ *rustVersion *= *"\([^"]*\)";.*/\1/p' flake.nix)
          echo "Cargo.toml=$MSRV rust-toolchain.toml=$CHANNEL flake.nix=$FLAKE"
          test -n "$MSRV" || { echo "no workspace.package.rust-version in Cargo.toml"; exit 1; }
          for v in "$CHANNEL" "$FLAKE"; do
            case "$v" in
              "$MSRV"|"$MSRV".*) ;;
              *) echo "toolchain pin '$v' does not match MSRV '$MSRV'"; exit 1 ;;
            esac
          done
