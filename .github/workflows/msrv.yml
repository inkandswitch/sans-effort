name: MSRV

# The MSRV is Cargo.toml's `rust-version`, and the flake reads it to build a
# toolchain of exactly that version: `test:msrv` checks the published crates
# with it. The development toolchain (flake.nix's `rustVersion`, and
# rust-toolchain.toml's channel for rustup users) may run ahead; this also
# checks those two agree.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "sans-effort*/src/**"
      - ".github/workflows/msrv.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix
        with:
          cargo-cache: msrv

      - run: nix develop .#ci --command test:msrv

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The development toolchain is pinned the same twice
        run: |
          CHANNEL=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          FLAKE=$(sed -n 's/^ *rustVersion *= *"\([^"]*\)";.*/\1/p' flake.nix)
          echo "rust-toolchain.toml=$CHANNEL flake.nix=$FLAKE"
          test -n "$CHANNEL" -a "$CHANNEL" = "$FLAKE" || { echo "the pins disagree"; exit 1; }
