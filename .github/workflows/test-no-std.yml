name: Check no_std

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          target: wasm32-unknown-unknown, thumbv6m-none-eabi

      - name: Check no_std (host)
        run: cargo check --workspace --no-default-features

      - name: Check wasm32
        run: cargo check --workspace --no-default-features --target wasm32-unknown-unknown

      - name: Check thumbv6m
        run: cargo check --workspace --no-default-features --target thumbv6m-none-eabi
