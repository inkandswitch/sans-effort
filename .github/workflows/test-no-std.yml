name: Check no_std

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix
        with:
          cargo-cache: no-std

      # The library crates without std (wasm32, thumbv6m), every feature
      # combination with a lock, and the demo routines.
      - run: nix develop .#ci --command test:no_std
