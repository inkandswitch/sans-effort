name: Check no_std

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          target: wasm32-unknown-unknown, thumbv6m-none-eabi

      # Only the core crate is no_std; the host crate and the demo are std by
      # design, so these are scoped with -p rather than --workspace.
      - name: Check no_std (host)
        run: cargo check -p effect_routine --no-default-features

      - name: Check wasm32
        run: cargo check -p effect_routine --no-default-features --target wasm32-unknown-unknown

      - name: Check thumbv6m (no CAS, no 64-bit atomics)
        run: cargo check -p effect_routine --no-default-features --features critical-section --target thumbv6m-none-eabi

      - name: Check the demo routine and wire crate are no_std (wasm32)
        run: cargo check -p routines -p greeter_wire --target wasm32-unknown-unknown
